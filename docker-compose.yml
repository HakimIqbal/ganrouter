version: "3.8"

services:
  ganrouter:
    build: .
    container_name: ganrouter
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      - NODE_ENV=production
      - PORT=20128
      - DATABASE_URL=postgresql://ganrouter:ganrouter@ganrouter-db:5432/ganrouter
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:?Set INITIAL_PASSWORD in .env}
      - API_KEY_SECRET=${API_KEY_SECRET:-change-me-api-key-secret}
      - MACHINE_ID_SALT=${MACHINE_ID_SALT:-change-me-machine-salt}
      - REQUIRE_API_KEY=true
      - AUTH_COOKIE_SECURE=false
      - OBSERVABILITY_ENABLED=true
      - DATA_DIR=/app/data
    volumes:
      - ganrouter-data:/app/data
    depends_on:
      ganrouter-db:
        condition: service_healthy
    networks:
      - ganrouter-net

  ganrouter-db:
    image: postgres:15-alpine
    container_name: ganrouter-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ganrouter
      - POSTGRES_USER=ganrouter
      - POSTGRES_PASSWORD=ganrouter
    volumes:
      - ganrouter-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganrouter"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ganrouter-net

volumes:
  ganrouter-data:
  ganrouter-pgdata:

networks:
  ganrouter-net:
    driver: bridge
